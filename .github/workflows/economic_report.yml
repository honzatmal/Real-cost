name: Telegram Economic Report

on:
  schedule:
    # 한국 시간 기준 6시, 7시, 8시, 10시, 12시, 14시, 16시, 18시 (KST = UTC + 9)
    # UTC 기준 시간: 21시, 22시, 23시, 01시, 03시, 05시, 07시, 09시
    - cron: '0 21,22,23 * * *'  # KST 06시, 07시, 08시
    - cron: '0 1,3,5,7,9 * * *'   # KST 10시, 12시, 14시, 16시, 18시
  workflow_dispatch: # 수동 테스트 실행 가능

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
